{% extends "base.html" %}
{% block title %}Projects{% endblock %}



{% block content %}

{% include "navbar.html" %}

<div class="container">
  <h1>Our Projects:</h1>
</div>

{% for project in projects %}
<div class="container">
  <h2>{{ project.title }}</h2>
  <p>{{ project.description }}</p>
  <a href="{{ project.sourceurl }}">
    <button class="butn">Source Code</button>
  </a>
</div>
{% endfor %}

{% endblock %}
